name: Sync NEXORA course layers

on:
  push:
    paths:
      - 'pcm_lessons.js'
      - 'competitive_lessons.js'
      - 'today_engine.js'
      - '.github/workflows/sync-pcm-lessons.yml'
      - 'pcm_sync_trigger.txt'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject course layers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          pcm=Path('pcm_lessons.js').read_text(encoding='utf-8').strip()
          comp=Path('competitive_lessons.js').read_text(encoding='utf-8').strip()
          today=Path('today_engine.js').read_text(encoding='utf-8').strip()
          pcm_start='<!-- NEXORA_PCM_DETAILED_START -->'; pcm_end='<!-- NEXORA_PCM_DETAILED_END -->'
          comp_start='<!-- NEXORA_COMPETITIVE_DETAILED_START -->'; comp_end='<!-- NEXORA_COMPETITIVE_DETAILED_END -->'
          today_start='<!-- NEXORA_TODAY_COURSE_BRIDGE_START -->'; today_end='<!-- NEXORA_TODAY_COURSE_BRIDGE_END -->'
          pcm_block=f'''{pcm_start}\n{pcm}\nwindow.nexoraPCMContent=pcmDetailedBank;\nObject.keys(pcmDetailedBank).forEach(subject=>{{knowledgeBank[subject]=knowledgeBank[subject]||{{}};Object.keys(pcmDetailedBank[subject]).forEach(topic=>{{const x=pcmDetailedBank[subject][topic];knowledgeBank[subject][topic]={{title:topic+' — NEXORA Lesson',concept:x.c,formulas:x.f,example:x.e.map((v,i)=>'Worked example '+String.fromCharCode(65+i)+': '+v[0]+' → '+v[1]).join('\\n\\n'),practice:x.q,commonMistakes:['Write the given data before choosing a formula.','Check units, signs and conditions.','After solving, verify the final answer.'],revision:x.f,testTopics:[topic],detailLevel:'chapter-specific'}};}});}});\n{pcm_end}'''
          comp_block=f'''{comp_start}\n{comp}\nwindow.competitiveLessonBank=competitiveLessonBank;\n{comp_end}'''
          today_block=f'''{today_start}\n<script>\n{today}\n</script>\n{today_end}'''
          def repl(text,start,end,block,anchor=None):
              if start in text and end in text:
                  a=text.index(start); b=text.index(end,a)+len(end); return text[:a]+block+text[b:]
              if anchor and anchor in text:return text.replace(anchor,block+'\n'+anchor,1)
              return text.replace('</body>',block+'\n</body>',1)
          text=repl(text,pcm_start,pcm_end,pcm_block,'const lessonBank={')
          text=repl(text,comp_start,comp_end,comp_block,'const lessonBank={')
          text=repl(text,today_start,today_end,today_block)

          # Override the legacy Today renderer after every original script has loaded.
          override='''<script>\n(function(){\n  function nexoraRenderToday(){\n    var bridge=window.nexoraTodayCourseBridge;\n    if(!bridge)return;\n    var box=document.getElementById('todayTasks');\n    if(!box)return;\n    var tasks=bridge.buildTodayTasks();\n    var d=typeof userData==='function'?userData():{};\n    var done=d.tasks||{};\n    var p=typeof profile==='function'?profile():null;\n    if(!p){box.innerHTML='<div class="empty-state"><b>Create your Student Profile first</b><p class="muted small">Choose your class, subjects and goal. NEXORA will then build your actual chapter study sessions.</p></div>';return;}\n    box.innerHTML=tasks.map(function(t){return '<div class="task '+(done[t.id]?'done':'')+'"><button class="task-open" onclick="window.nexoraTodayCourseBridge.openRealSession(\\''+String(t.id).replace(/\\'/g,"&#39;")+"\\')"><span class=\"task-title\">"+(done[t.id]?'✓ ':'')+String(t.title).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})+'</span><div class="muted small">'+String(t.meta).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})+' • '+(done[t.id]?'Completed — open again':'Open actual chapter lesson →')+'</div></button></div>';}).join('');\n    var bar=document.getElementById('todayProgress');\n    var txt=document.getElementById('todayProgressText');\n    var completed=tasks.filter(function(t){return done[t.id];}).length;\n    if(bar)bar.style.width=(tasks.length?Math.round(completed/tasks.length*100):0)+'%';\n    if(txt)txt.textContent='Day '+(typeof cycleDay==='function'?cycleDay():1)+'/21 • '+completed+'/'+tasks.length+' study sessions complete.';\n  }\n  window.nexoraRenderToday=nexoraRenderToday;\n  setTimeout(function(){if(typeof renderToday==='function')renderToday=nexoraRenderToday;nexoraRenderToday();},0);\n  setTimeout(function(){if(typeof renderToday==='function')renderToday=nexoraRenderToday;},500);\n})();\n</script>'''
          text=text.replace('</body>',override+'\n</body>',1)
          index.write_text(text,encoding='utf-8')
          PY

      - name: Verify generated app
        run: |
          test -s index.html
          grep -q 'NEXORA_PCM_DETAILED_START' index.html
          grep -q 'NEXORA_COMPETITIVE_DETAILED_START' index.html
          grep -q 'NEXORA_TODAY_COURSE_BRIDGE_START' index.html
          grep -q 'nexoraTodayCourseBridge' index.html
          node --check today_engine.js
          echo 'NEXORA generated index verified.'

      - name: Commit generated index
        run: |
          git config user.name 'NEXORA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No index change needed.'; else git commit -m 'Fix Today chapter renderer sync'; git push; fi
