name: Sync NEXORA course layers

on:
  push:
    paths:
      - 'pcm_lessons.js'
      - 'competitive_lessons.js'
      - 'today_engine.js'
      - '.github/workflows/sync-pcm-lessons.yml'
      - 'pcm_sync_trigger.txt'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject course layers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          index = Path('index.html')
          pcm = Path('pcm_lessons.js').read_text(encoding='utf-8').strip()
          comp = Path('competitive_lessons.js').read_text(encoding='utf-8').strip()
          today = Path('today_engine.js').read_text(encoding='utf-8').strip()
          pcm = re.sub(r'(q:\[\[.*)(?<!\])\]}(?=,|\n|$)', r'\1]]}', pcm)
          text = index.read_text(encoding='utf-8')
          pcm_start = '<!-- NEXORA_PCM_DETAILED_START -->'
          pcm_end = '<!-- NEXORA_PCM_DETAILED_END -->'
          pcm_block = f'''{pcm_start}\n{pcm}\nwindow.nexoraPCMContent = pcmDetailedBank;\nObject.keys(pcmDetailedBank).forEach(subject => {{\n  knowledgeBank[subject] = knowledgeBank[subject] || {{}};\n  Object.keys(pcmDetailedBank[subject]).forEach(topic => {{\n    const x = pcmDetailedBank[subject][topic];\n    knowledgeBank[subject][topic] = {{\n      title: topic + " — NEXORA Lesson",\n      concept: x.c,\n      formulas: x.f,\n      example: x.e.map((v,i) => "Worked example " + String.fromCharCode(65+i) + ": " + v[0] + " → " + v[1]).join("\\n\\n"),\n      practice: x.q,\n      commonMistakes: ["Write the given data before choosing a formula.", "Check units, signs and conditions.", "After solving, substitute the answer back when possible."],\n      revision: x.f,\n      testTopics: [topic],\n      detailLevel: "chapter-specific"\n    }};\n  }});\n}});\n{pcm_end}'''
          comp_start = '<!-- NEXORA_COMPETITIVE_DETAILED_START -->'
          comp_end = '<!-- NEXORA_COMPETITIVE_DETAILED_END -->'
          comp_block = f'''{comp_start}\n{comp}\nwindow.competitiveLessonBank = competitiveLessonBank;\n{comp_end}'''
          today_start = '<!-- NEXORA_TODAY_COURSE_BRIDGE_START -->'
          today_end = '<!-- NEXORA_TODAY_COURSE_BRIDGE_END -->'
          today_block = f'''{today_start}\n<script>\n{today}\n</script>\n{today_end}'''

          def replace_or_insert(text, start, end, block):
              if start in text and end in text:
                  a = text.index(start)
                  b = text.index(end, a) + len(end)
                  return text[:a] + block + text[b:]
              return text.replace('</body>', block + '\n</body>', 1)

          def replace_or_insert_course(text, start, end, block):
              if start in text and end in text:
                  a = text.index(start)
                  b = text.index(end, a) + len(end)
                  return text[:a] + block + text[b:]
              marker = 'const lessonBank={'
              if marker not in text:
                  raise SystemExit('Course injection anchor not found')
              return text.replace(marker, block + '\n' + marker, 1)

          text = replace_or_insert_course(text, pcm_start, pcm_end, pcm_block)
          text = replace_or_insert_course(text, comp_start, comp_end, comp_block)
          text = replace_or_insert(text, today_start, today_end, today_block)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Verify JavaScript syntax and course layers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,re.S)
          js='\n'.join(scripts)
          Path('/tmp/nexora.js').write_text(js,encoding='utf-8')
          print('index.html bytes:',len(html.encode()))
          print('PCM marker:', '<!-- NEXORA_PCM_DETAILED_START -->' in html)
          print('Competitive marker:', '<!-- NEXORA_COMPETITIVE_DETAILED_START -->' in html)
          print('Today bridge:', '<!-- NEXORA_TODAY_COURSE_BRIDGE_START -->' in html)
          print('PCM global:', 'window.nexoraPCMContent = pcmDetailedBank;' in js)
          print('Competitive exams:', js.count('competitiveLessonBank'))
          print('Competitive global:', 'window.competitiveLessonBank = competitiveLessonBank;' in js)
          print('Chapter-specific:', js.count('chapter-specific'))
          print('Competitive bridge:', js.count('nexoraTodayCourseBridge'))
          PY
          node --check /tmp/nexora.js

      - name: Commit generated index
        run: |
          git config user.name 'NEXORA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index change needed.'
          else
            git commit -m 'Connect Today to real chapter lesson content'
            git push
          fi
